async function fetchMotoSpecs(marca,modelo,year){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'Specs de '+marca+' '+modelo+' '+year+'. SOLO JSON: {"rendimiento_kmL":n,"tanque_litros":n,"aceite_tipo":"s","aceite_cada_km":n,"cadena_cada_km":n,"filtro_aire_cada_km":n,"bujias_cada_km":n,"pastillas_cada_km":n,"neumaticos_cada_km":n,"presion_delantera_bar":n,"presion_trasera_bar":n,"potencia_hp":n,"torque_nm":n,"tipo":"s","consejo_mx":"s"}'}]})});
  const data=await res.json();
  return JSON.parse(data.content.find(b=>b.type==='text')?.text?.trim()||'{}');
}

  function Navega(){

    const coords=ruta.coords||RUTAS_AUTOPISTA[0].coords;
    const pos=routePoint(coords,navPct);
    const navRiders=[{lat:pos[0],lng:pos[1],color:T.a,you:true,name:'Tú'},{lat:pos[0]+0.005,lng:pos[1]+0.008,color:T.b,you:false,name:'Chavo',spd:75}];

        </div>

      <div style={{flex:1,position:'relative',overflow:'hidden'}}>

            <div style={{padding:'11px 13px',background:T.bg,border:'1px solid '+T.border,borderRadius:9,fontSize:13,color:T.muted,wordBreak:'break-all',marginBottom:9}}>{rodadaLink}</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>{navigator.clipboard?.writeText(rodadaLink).catch(()=>{});alert('¡Link copiado!');}} style={{flex:1,padding:'12px',background:T.card,border:'1px solid '+T.border,borderRadius:10,...rj(13,600,T.muted),cursor:'pointer'}}>📋 Copiar</button>
              <button onClick={compartirWA} style={{flex:2,padding:'12px',background:'#25D366',border:'none',borderRadius:10,...rj(13,700,'#fff'),cursor:'pointer'}}>📲 Compartir WhatsApp</button>
            </div>
          </div>}
        </div>
      </div>}
    </div>
  );}

  function Negocios(){return(
    <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={card({background:T.aD,borderColor:T.a+'33',padding:'12px 15px'})}><div style={{fontSize:14,color:T.a,fontWeight:500}}>📍 Negocios en Córdoba, Ver. · {ruta.from}→{ruta.to}</div></div>
      {NEGOCIOS.map(n=>(
        <div key={n.id} style={card({borderLeft:n.sp?'3px solid '+T.a:'none'})}>
          <div style={{display:'flex',alignItems:'flex-start',gap:13}}>
            <div style={{width:50,height:50,background:T.surf,borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0,border:'1px solid '+T.border}}>{n.ico}</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
                <span style={{fontSize:13,color:T.muted}}>{n.cat}</span>
                {n.sp&&<span style={tg(T.a)}>Patrocinado</span>}
              </div>
              <div style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:5}}>{n.name}</div>
              <div style={{display:'flex',gap:9,marginBottom:9}}>
                <span style={{fontSize:13,color:T.yellow}}>★ {n.stars}</span>
                <span style={{fontSize:13,color:T.muted}}>({n.rev}) · {n.km} km</span>
              </div>
              <div style={{background:T.bD,border:'1px solid '+T.b+'33',borderRadius:8,padding:'7px 11px',fontSize:13,color:T.b}}>🎁 {n.promo}</div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );}

  function Mas(){return(
    <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={sec({marginBottom:0})}>Mantenimiento predictivo</div>
        {specs&&<span style={tg(T.a)}>✓ {moto.modelo}</span>}
      </div>
      {mantItems.map((m,i)=>{const pct=Math.min(100,Math.round(m.ult/m.prox*100));const col=m.urg?T.red:pct>80?T.yellow:T.a;return(
        <div key={i} style={card({borderLeft:'3px solid '+col,padding:'13px 15px'})}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
            <span style={{fontSize:14,fontWeight:600,color:T.text}}>{m.item}</span>
            {m.urg&&<span style={tg(T.red)}>Urgente</span>}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:T.muted,marginBottom:8}}>
            <span>Cada {m.cada}</span><span style={{color:col,fontWeight:600}}>faltan {m.prox-m.ult} km</span>
          </div>
          <div style={{height:5,background:T.border,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:pct+'%',background:col,borderRadius:3}}/>
          </div>
        </div>
      );})}
      {!specs&&<div style={card({borderColor:T.a+'33',background:T.aD,cursor:'pointer',padding:'14px'})} onClick={()=>setScr('moto')}>
        <div style={{fontSize:14,color:T.a,textAlign:'center'}}>🤖 Registra tu moto para mantenimiento personalizado</div>
      </div>}
      {diario.length>0&&<>
        <div style={sec({marginTop:8})}>Mi diario de rodadas</div>
        {diario.map((d,i)=>(
          <div key={i} style={card({padding:'13px 15px',borderLeft:'3px solid '+T.b})}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div><div style={{fontSize:14,fontWeight:600,color:T.text}}>{d.ruta}</div><div style={{fontSize:12,color:T.muted,marginTop:2}}>{d.fecha} · {d.tiempo}</div></div>
              <div style={{textAlign:'right'}}><div style={{...rj(17,700,T.b)}}>{d.km}<span style={{fontSize:11,color:T.muted}}>km</span></div><div style={{fontSize:12,color:T.muted}}>{d.costo}</div></div>
            </div>
          </div>
        ))}
        <button onClick={()=>{setDiario([]);try{localStorage.removeItem('rodada-diario');}catch(e){}}} style={{...btnP(T.card,T.muted),border:'1px solid '+T.border,marginTop:4,fontSize:13}}>Limpiar diario</button>
      </>}
      {diario.length===0&&<div style={card({borderColor:T.b+'33',background:T.bD+'44',padding:'15px'})}>
        <div style={{fontSize:14,color:T.b,textAlign:'center'}}>📓 Tu diario está vacío · Guarda una ruta desde Planear Ruta</div>
      </div>}
      <div style={sec({marginTop:8})}>Mis estadísticas</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11,marginBottom:15}}>
        {[{v:'4,827',u:'km',l:'🛣 Total km',c:T.a},{v:String(23+diario.length),u:'',l:'🏍 Rodadas',c:T.b},{v:'$4,210',u:'',l:'💸 Casetas mes',c:'#FF9A3C'},{v:'186',u:'L',l:'⛽ Gasolina mes',c:T.c}].map((s,i)=>(
          <div key={i} style={sb(s.c)}><div style={{...rj(24,700,s.c)}}>{s.v}<span style={{fontSize:13,color:T.muted}}>{s.u}</span></div><div style={{fontSize:13,color:T.muted,marginTop:4}}>{s.l}</div></div>
        ))}
      </div>
      <div style={card({borderLeft:'3px solid '+T.red,textAlign:'center',padding:'24px 16px'})}>
        <div style={{fontSize:14,color:T.muted,marginBottom:15}}>¿Emergencia en carretera?</div>
        <button style={{...btnP(T.red,'#fff'),fontSize:20,letterSpacing:3,padding:'18px'}}>🆘 BOTÓN SOS</button>
        <div style={{fontSize:13,color:T.muted,marginTop:13,lineHeight:1.7}}>Comparte ubicación · Emergencias · Taller más cercano</div>
      </div>
    </div>
  );}

  // ── Navegación inferior ─────────────────────────────────────────────────
  const NAV=[{id:'home',ico:'🏠',lbl:'Inicio'},{id:'moto',ico:'🏍',lbl:'Mi Moto'},{id:'ruta',ico:'🗺',lbl:'Ruta'},{id:'navega',ico:'🧭',lbl:'GPS'},{id:'grupo',ico:'📡',lbl:'Grupo'},{id:'negocios',ico:'🏢',lbl:'Negoc.'},{id:'mas',ico:'⚙️',lbl:'Más'}];
  const TITLES={home:'Córdoba, Veracruz',moto:'Mi Moto · IA',ruta:'Planear Ruta',navega:'Navegación GPS',grupo:'Grupo + Rodadas',negocios:'Negocios',mas:'Más',reg:'Registro'};

  if(scr==='reg')return(
    <div style={{fontFamily:"'Barlow',sans-serif",background:T.bg,color:T.text,height:'100dvh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden'}}>
      <ThemePicker/>
      {Registro()}
    </div>
  );

  return(
    <div style={{fontFamily:"'Barlow',sans-serif",background:T.bg,color:T.text,height:'100dvh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden',transition:'background .3s'}}>
      {scr!=='navega'&&<div style={{background:T.surf,borderBottom:'1px solid '+T.border,padding:'12px 18px 10px',display:'flex',alignItems:'center',flexShrink:0}}>
        <div style={{...rj(24,700,T.a),letterSpacing:4}}>RODADA</div>
        <div style={{fontSize:12,color:T.muted,marginLeft:9,marginTop:3,letterSpacing:2,textTransform:'uppercase'}}>{TITLES[scr]}</div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6}}><div style={dot()}/><span style={{...rj(12,600,T.a)}}>GPS</span></div>
      </div>}
      <ThemePicker/>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {scr==='home'&&Home()}
        {scr==='moto'&&MiMoto()}
        {scr==='ruta'&&Ruta()}
        {scr==='navega'&&Navega()}
        {scr==='grupo'&&Grupo()}
        {scr==='negocios'&&Negocios()}
        {scr==='mas'&&Mas()}
      </div>
      <div style={{display:'flex',background:T.surf,borderTop:'1px solid '+T.border,flexShrink:0,paddingBottom:'env(safe-area-inset-bottom)'}}>
        {NAV.map(n=>{const a=scr===n.id;return(
          <button key={n.id} onClick={()=>setScr(n.id)} style={{flex:1,padding:'8px 0 10px',background:'none',border:'none',borderTop:'2.5px solid '+(a?T.a:'transparent'),color:a?T.a:T.muted,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'color .15s'}}>
            <span style={{fontSize:18}}>{n.ico}</span>
            <span style={{fontFamily:"'Rajdhani',sans-serif",fontSize:10,fontWeight:a?700:500,letterSpacing:1,textTransform:'uppercase'}}>{n.lbl}</span>
          </button>
        );})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Rodada));

</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').then(function(r){console.log('RODADA v7 OK · Córdoba VER');}).catch(function(e){console.log('SW err',e);});});}
</script>
</body>
</html>
