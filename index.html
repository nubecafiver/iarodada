// Interpola posición a lo largo de una ruta (t=0..1)
function routePoint(coords,t){
  if(!coords||coords.length<2)return coords?coords[0]:[19.43,-99.13];
  if(t<=0)return coords[0]; if(t>=1)return coords[coords.length-1];
  const lens=[]; let tot=0;
  for(let i=0;i<coords.length-1;i++){
    const d=Math.sqrt((coords[i+1][0]-coords[i][0])**2+(coords[i+1][1]-coords[i][1])**2);
    lens.push(d); tot+=d;
  }
  let tgt=t*tot,cum=0;
  for(let i=0;i<lens.length;i++){
    if(cum+lens[i]>=tgt){
      const s=(tgt-cum)/lens[i];
      return[coords[i][0]+s*(coords[i+1][0]-coords[i][0]),coords[i][1]+s*(coords[i+1][1]-coords[i][1])];
    }
    cum+=lens[i];
  }
  return coords[coords.length-1];
}

// ── Carga Leaflet una sola vez ────────────────────────────────────────────
let _leafletPending=false;
const _leafletCbs=[];
function loadLeaflet(cb){
  if(window.L){cb();return;}
  _leafletCbs.push(cb);
  if(_leafletPending)return;
  _leafletPending=true;
  const link=document.createElement('link');
  link.rel='stylesheet';
  link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);
  const s=document.createElement('script');
  s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=()=>{ _leafletCbs.forEach(f=>f()); _leafletCbs.length=0; };
  document.head.appendChild(s);
}

// ── Componente mapa Leaflet real ─────────────────────────────────────────
function MapaReal({height=200,center,zoom=11,riders=[],route=[],casetas=[],label='',sub='',accentColor='#22C55E',showGPS=false}){
  const ref=useRef(null);
  const [listo,setListo]=useState(!!window.L);

  useEffect(()=>{
    if(window.L){setListo(true);return;}
    loadLeaflet(()=>setListo(true));
  },[]);

  useEffect(()=>{
    if(!listo||!ref.current)return;
    const L=window.L;
    const map=L.map(ref.current,{center:center||[19.30,-99.20],zoom,zoomControl:false,attributionControl:false});

    // Tiles oscuros gratis (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);

    // Ruta en morado (estilo Waze)
    if(route.length>1){
      L.polyline(route,{color:'#7C3AED',weight:5,opacity:.85}).addTo(map);
      L.polyline(route,{color:'#A78BFA',weight:2,opacity:.5}).addTo(map);
    }

    // Casetas
    casetas.forEach(c=>{
      const icon=L.divIcon({
        html:`<div style="background:#FB923C;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);">⛩ ${c.n} $${c.f}</div>`,
        className:'',iconAnchor:[0,10]
      });
      L.marker([c.lat,c.lng],{icon}).addTo(map);
    });

    // Riders
    riders.forEach(r=>{
      const sz=r.you?20:14;
      const anim=r.you?'animation:gpsPulse 2s infinite;':'';
      const icon=L.divIcon({
        html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${r.color};border:2.5px solid white;box-shadow:0 0 8px ${r.color};${anim}"></div>`,
        className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
      });
      const mk=L.marker([r.lat,r.lng],{icon}).addTo(map);
      if(r.name)mk.bindPopup(`<b>${r.name}</b>${r.spd?`<br>${r.spd} km/h · 🔋${r.bat}%`:''}`,{maxWidth:120});
      if(r.you)mk.openPopup();
    });

    // Botón GPS real
    if(showGPS){
      const gpsBtn=L.control({position:'bottomright'});
      gpsBtn.onAdd=()=>{
        const btn=document.createElement('button');
        btn.innerHTML='📍 Mi GPS';
        btn.style.cssText='background:#22C55E;color:#040804;border:none;border-radius:10px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px;';
        btn.onclick=()=>{
          navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>{
            const{latitude:lat,longitude:lng}=pos.coords;
            map.setView([lat,lng],14);
            const icon=L.divIcon({html:`<div style="width:22px;height:22px;border-radius:50%;background:#22C55E;border:3px solid white;box-shadow:0 0 12px #22C55E;"></div>`,className:'',iconSize:[22,22],iconAnchor:[11,11]});
            L.marker([lat,lng],{icon}).addTo(map).bindPopup('📍 Tú estás aquí').openPopup();
          });
        };
        return btn;
      };
      gpsBtn.addTo(map);
    }

    setTimeout(()=>map.invalidateSize(),150);
    return()=>map.remove();
  },[listo]);

  return(
    <div style={{height,borderRadius:12,overflow:'hidden',position:'relative'}}>
      <div ref={ref} style={{width:'100%',height:'100%'}}/>
      {!listo&&(
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#060c07',gap:10}}>
          <div style={{width:24,height:24,border:`3px solid ${accentColor}`,borderTopColor:'transparent',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
          <div style={{fontFamily:"'Rajdhani',sans-serif",fontSize:13,color:accentColor}}>Cargando mapa real…</div>
        </div>
      )}
      {label&&listo&&(
        <div style={{position:'absolute',top:10,left:10,background:'#00000099',backdropFilter:'blur(6px)',borderRadius:8,padding:'5px 10px',display:'flex',alignItems:'center',gap:6,zIndex:1000}}>
          <div style={{width:7,height:7,borderRadius:'50%',background:accentColor,animation:'livePulse 2s infinite'}}/>
          <span style={{fontFamily:"'Rajdhani',sans-serif",fontSize:11,fontWeight:600,color:accentColor}}>{label}</span>
        </div>
      )}
      {sub&&listo&&(
        <div style={{position:'absolute',bottom:8,left:10,right:10,background:'#00000099',backdropFilter:'blur(4px)',borderRadius:7,padding:'4px 10px',zIndex:1000}}>
          <div style={{fontSize:10,color:'#aaa',textAlign:'center'}}>{sub}</div>
        </div>
      )}
    </div>
  );
}

// ── Buscar specs de moto con IA ───────────────────────────────────────────
async function fetchMotoSpecs(marca,modelo,year){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:800,
      messages:[{role:"user",content:`Eres experto en motocicletas. Dame specs de la ${marca} ${modelo} ${year}.
Responde SOLO con JSON válido, sin texto extra ni backticks:
{"rendimiento_kmL":número,"tanque_litros":número,"aceite_tipo":"string","aceite_cada_km":número,"cadena_cada_km":número_o_null,"filtro_aire_cada_km":número,"bujias_cada_km":número,"pastillas_cada_km":número,"neumaticos_cada_km":número,"presion_delantera_bar":número,"presion_trasera_bar":número,"potencia_hp":número,"torque_nm":número,"tipo":"naked|sport|adventure|cruiser|scooter|enduro|touring","consejo_mx":"tip para México máx 100 chars"}`}]
    })
  });
  const data=await res.json();
  const text=data.content.find(b=>b.type==='text')?.text?.trim()||'';
  return JSON.parse(text);
}

        return(<div key={i} style={card({borderLeft:`3px solid ${col}`,padding:'12px 14px'})}>

        </div>);
      })}
      {!specs&&<div style={card({borderColor:T.a+'33',background:T.aD,cursor:'pointer',padding:'12px 14px'})} onClick={()=>setScr('moto')}><div style={{fontSize:12,color:T.a,textAlign:'center'}}>🤖 Registra tu moto para mantenimiento personalizado por modelo</div></div>}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        {[{v:'4,827',u:'km',l:'🛣 Total km',c:T.a},{v:'23',u:'',l:'🏍 Rodadas',c:T.b},{v:'$4,210',u:'',l:'💸 Casetas mes',c:'#FF9A3C'},{v:'186',u:'L',l:'⛽ Gasolina mes',c:T.c}].map((s,i)=>(
          <div key={i} style={sb(s.c)}><div style={{...rj(22,700,s.c)}}>{s.v}<span style={{fontSize:11,color:T.muted}}>{s.u}</span></div><div style={{fontSize:10,color:T.muted,marginTop:4}}>{s.l}</div></div>
        ))}
      </div>
      <div style={card({borderLeft:`3px solid ${T.red}`,textAlign:'center',padding:'22px 16px'})}>
        <div style={{fontSize:13,color:T.muted,marginBottom:14}}>¿Emergencia en carretera?</div>
        <button style={{...btnP(T.red,'#fff'),fontSize:18,letterSpacing:3,padding:'16px'}}>🆘 BOTÓN SOS</button>
        <div style={{fontSize:11,color:T.muted,marginTop:12,lineHeight:1.7}}>Comparte ubicación · Emergencias · Taller más cercano</div>
      </div>
    </div>
  );

  const NAV=[{id:'home',ico:'🏠',lbl:'Inicio'},{id:'moto',ico:'🏍',lbl:'Mi Moto'},{id:'ruta',ico:'🗺',lbl:'Ruta'},{id:'navega',ico:'🧭',lbl:'GPS'},{id:'grupo',ico:'📡',lbl:'Grupo'},{id:'negocios',ico:'🏢',lbl:'Negoc.'},{id:'mas',ico:'⚙️',lbl:'Más'}];
  const TITLES={home:'Tu copiloto moto',moto:'Mi Moto · IA',ruta:'Planear Ruta',navega:'Navegación GPS',grupo:'Grupo en Vivo',negocios:'Negocios en Ruta',mas:'Más'};
  return(
    <>
      <style>{CSS}</style>
      <div style={{fontFamily:"'Barlow',sans-serif",background:T.bg,color:T.text,height:'100vh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden',transition:'background .3s'}}>
        {scr!=='navega'&&(
          <div style={{background:T.surf,borderBottom:`1px solid ${T.border}`,padding:'11px 18px 9px',display:'flex',alignItems:'center',flexShrink:0}}>
            <div style={{...rj(22,700,T.a),letterSpacing:4}}>RODADA</div>
            <div style={{fontSize:10,color:T.muted,marginLeft:8,marginTop:4,...rj(10,500,T.muted),letterSpacing:2,textTransform:'uppercase'}}>{TITLES[scr]}</div>
            <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6}}><div style={dot()}/><span style={{...rj(10,600,T.a)}}>GPS</span></div>
          </div>
        )}
        <ThemePicker/>
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {scr==='home'&&Home()}
          {scr==='moto'&&MiMoto()}
          {scr==='ruta'&&Ruta()}
          {scr==='navega'&&Navega()}
          {scr==='grupo'&&Grupo()}
          {scr==='negocios'&&Negocios()}
          {scr==='mas'&&Mas()}
        </div>
        <div style={{display:'flex',background:T.surf,borderTop:`1px solid ${T.border}`,flexShrink:0}}>
          {NAV.map(n=>{const a=scr===n.id;return(
            <button key={n.id} onClick={()=>setScr(n.id)} style={{flex:1,padding:'7px 0 9px',background:'none',border:'none',borderTop:`2px solid ${a?T.a:'transparent'}`,color:a?T.a:T.muted,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'color .15s'}}>
              <span style={{fontSize:16}}>{n.ico}</span>
              <span style={{...rj(8,a?700:500,a?T.a:T.muted),letterSpacing:1,textTransform:'uppercase'}}>{n.lbl}</span>
            </button>
          );})}
        </div>
      </div>
    </>
  );
}
      </div>}
    </div>
  );
};
