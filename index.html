function routePoint(coords,t){
  if(!coords||coords.length<2)return coords?coords[0]:[19.43,-99.13];
  if(t<=0)return coords[0];if(t>=1)return coords[coords.length-1];
  const lens=[];let tot=0;
  for(let i=0;i<coords.length-1;i++){const d=Math.sqrt((coords[i+1][0]-coords[i][0])**2+(coords[i+1][1]-coords[i][1])**2);lens.push(d);tot+=d;}
  let tgt=t*tot,cum=0;
  for(let i=0;i<lens.length;i++){if(cum+lens[i]>=tgt){const s=(tgt-cum)/lens[i];return[coords[i][0]+s*(coords[i+1][0]-coords[i][0]),coords[i][1]+s*(coords[i+1][1]-coords[i][1])];}cum+=lens[i];}
  return coords[coords.length-1];
}

let _lfPending=false;const _lfCbs=[];
function loadLeaflet(cb){
  if(window.L){cb();return;}
  _lfCbs.push(cb);
  if(_lfPending)return;
  _lfPending=true;
  const lnk=document.createElement('link');lnk.rel='stylesheet';lnk.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(lnk);
  const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=()=>{_lfCbs.forEach(f=>f());_lfCbs.length=0;};document.head.appendChild(s);
}

function MapaReal({height=200,center,zoom=11,riders=[],route=[],casetas=[],label='',sub='',accentColor='#22C55E',showGPS=false}){
  const ref=useRef(null);
  const [listo,setListo]=useState(!!window.L);
  useEffect(()=>{if(window.L){setListo(true);return;}loadLeaflet(()=>setListo(true));},[]);
  useEffect(()=>{
    if(!listo||!ref.current)return;
    const L=window.L;
    const map=L.map(ref.current,{center:center||[19.30,-99.20],zoom,zoomControl:false,attributionControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
    if(route.length>1){
      L.polyline(route,{color:'#7C3AED',weight:5,opacity:.85}).addTo(map);
      L.polyline(route,{color:'#A78BFA',weight:2,opacity:.5}).addTo(map);
    }
    casetas.forEach(c=>{
      if(!c.lat)return;
      const icon=L.divIcon({html:`<div style="background:#FB923C;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);">\u26E9 ${c.n} $${c.f}</div>`,className:'',iconAnchor:[0,10]});
      L.marker([c.lat,c.lng],{icon}).addTo(map);
    });
    riders.forEach(r=>{
      const sz=r.you?20:14;
      const icon=L.divIcon({html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${r.color};border:2.5px solid white;box-shadow:0 0 8px ${r.color};"></div>`,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      const mk=L.marker([r.lat,r.lng],{icon}).addTo(map);
      if(r.name)mk.bindPopup(`<b>${r.name}</b>${r.spd?`<br>${r.spd} km/h \u{1F50B}${r.bat}%`:''}`,{maxWidth:130});
      if(r.you)setTimeout(()=>mk.openPopup(),300);
    });
    if(showGPS){
      const ctrl=L.control({position:'bottomright'});
      ctrl.onAdd=()=>{
        const btn=document.createElement('button');
        btn.innerHTML='\uD83D\uDCCD Mi GPS';
        btn.style.cssText=`background:${accentColor};color:#040804;border:none;border-radius:10px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;`;
        btn.onclick=()=>{
          navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>{
            map.setView([pos.coords.latitude,pos.coords.longitude],15);
            const icon=L.divIcon({html:`<div style="width:22px;height:22px;border-radius:50%;background:${accentColor};border:3px solid white;box-shadow:0 0 12px ${accentColor};"></div>`,className:'',iconSize:[22,22],iconAnchor:[11,11]});
            L.marker([pos.coords.latitude,pos.coords.longitude],{icon}).addTo(map).bindPopup('\uD83D\uDCCD T\u00fa est\u00e1s aqu\u00ed').openPopup();
          });
        };
        return btn;
      };
      ctrl.addTo(map);
    }
    setTimeout(()=>map.invalidateSize(),200);
    return()=>map.remove();
  },[listo]);
  return(
    <div style={{height,borderRadius:12,overflow:'hidden',position:'relative'}}>
      <div ref={ref} style={{width:'100%',height:'100%'}}/>
      {!listo&&<div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#060c07',gap:10}}>
        <div style={{width:24,height:24,border:`3px solid ${accentColor}`,borderTopColor:'transparent',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
        <div style={{fontFamily:"'Rajdhani',sans-serif",fontSize:12,color:accentColor}}>Cargando mapa real\u2026</div>
      </div>}
      {label&&listo&&<div style={{position:'absolute',top:10,left:10,background:'#00000099',backdropFilter:'blur(6px)',borderRadius:8,padding:'5px 10px',display:'flex',alignItems:'center',gap:6,zIndex:1000}}>
        <div style={{width:7,height:7,borderRadius:'50%',background:accentColor,animation:'livePulse 2s infinite'}}/>
        <span style={{fontFamily:"'Rajdhani',sans-serif",fontSize:11,fontWeight:600,color:accentColor}}>{label}</span>
      </div>}
      {sub&&listo&&<div style={{position:'absolute',bottom:8,left:10,right:10,background:'#00000099',borderRadius:7,padding:'4px 10px',zIndex:1000}}>
        <div style={{fontSize:10,color:'#aaa',textAlign:'center'}}>{sub}</div>
      </div>}
    </div>
  );
}

async function fetchMotoSpecs(marca,modelo,year){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,
      messages:[{role:"user",content:`Specs de la ${marca} ${modelo} ${year}. SOLO JSON sin texto extra: {"rendimiento_kmL":n,"tanque_litros":n,"aceite_tipo":"str","aceite_cada_km":n,"cadena_cada_km":n,"filtro_aire_cada_km":n,"bujias_cada_km":n,"pastillas_cada_km":n,"neumaticos_cada_km":n,"presion_delantera_bar":n,"presion_trasera_bar":n,"potencia_hp":n,"torque_nm":n,"tipo":"str","consejo_mx":"str max 80chars"}`}]})
  });
  const data=await res.json();
  return JSON.parse(data.content.find(b=>b.type==='text')?.text?.trim()||'{}');
}

        {rutaMode==='sct'&&<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{padding:'8px 14px',background:T.aD,borderBottom:`1px solid ${T.border}`,flexShrink:0,display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:14}}>\uD83C\uDFDB</span>
            <div>
              <div style={{fontSize:12,color:T.a,fontWeight:600}}>Rutas Punto a Punto \u00b7 SCT / CAPUFE</div>
              <div style={{fontSize:10,color:T.muted}}>Selecciona "Motocicleta" como tipo de veh\u00edculo</div>
            </div>
          </div>
          <iframe src="https://app.sct.gob.mx/sibuac_internet/ControllerUI?action=cmdEscogeRuta" style={{flex:1,border:'none',width:'100%',minHeight:0}} title="SCT Rutas"/>
        </div>}
        {rutaMode==='preset'&&<div style={{flex:1,overflowY:'auto',padding:16}}>
          <div style={card()}>
            <div style={sec()}>Selecciona tu ruta</div>
            {RUTAS.map(r=>(
              <button key={r.id} onClick={()=>setRuta(r)} style={{display:'flex',alignItems:'center',width:'100%',background:ruta.id===r.id?T.aD:'transparent',border:`1px solid ${ruta.id===r.id?T.a:T.border}`,borderRadius:11,padding:'10px 13px',cursor:'pointer',marginBottom:7,gap:10,transition:'all .15s',textAlign:'left',fontFamily:"'Barlow',sans-serif"}}>
                <span style={{fontSize:17}}>\uD83C\uDFCD</span>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:ruta.id===r.id?T.a:T.text}}>{r.label}</div><div style={{fontSize:11,color:T.muted,marginTop:2}}>{r.km} km \u00b7 {r.casetas.length} caseta{r.casetas.length!==1?'s':''} \u00b7 {htime(r.km/r.spd)}</div></div>
                {ruta.id===r.id&&<span style={{color:T.a}}>\u2713</span>}
              </button>
            ))}
          </div>
          {sinAlc&&<div style={card({borderColor:T.red+'55',background:T.redD})}><div style={{fontSize:13,color:T.red,lineHeight:1.7}}>\u26FD <strong>Necesitas parar.</strong> Autonom\u00eda: <span style={{...rj(14,700,T.red)}}>{autonomia}km</span> \u00b7 Ruta: <span style={{...rj(14,700,T.red)}}>{ruta.km}km</span>. Carga en el km {Math.round(autonomia*.85)}.</div></div>}
          <div style={card({borderColor:T.a+'44',background:`linear-gradient(135deg,${T.a}10,${T.card})`})}>
            <div style={sec()}>Resumen del viaje</div>
            <div style={{textAlign:'center',padding:'12px 0 16px',borderBottom:`1px solid ${T.border}`,marginBottom:14}}>
              <div style={{fontSize:10,color:T.muted,letterSpacing:2,textTransform:'uppercase',marginBottom:6}}>Costo total estimado</div>
              <div style={{...rj(52,700,T.a),lineHeight:1}}>{mxn(total)}</div>
              <div style={{fontSize:12,color:T.muted,marginTop:5}}>{ruta.km} km \u00b7 {mxn(total/ruta.km)}/km</div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
              {[{v:mxn(casTotal),l:`\u26E9 ${ruta.casetas.length} caseta${ruta.casetas.length!==1?'s':''}`,c:'#FF9A3C'},{v:mxn(gasCosto),l:`\u26FD ${litros.toFixed(1)}L \u00b7 ${moto.fuel}`,c:T.b},{v:htime(tHoras),l:'\uD83D\uDD50 Tiempo estimado',c:T.text},{v:`${autonomia}km`,l:sinAlc?'\u26A0\uFE0F Sin alcance':'\uD83D\uDD0B Tu autonom\u00eda',c:sinAlc?T.red:T.c}].map((s,i)=>(
                <div key={i} style={sb(s.c)}><div style={{...rj(20,700,s.c)}}>{s.v}</div><div style={{fontSize:10,color:T.muted,marginTop:4}}>{s.l}</div></div>
              ))}
            </div>
            <div style={sec()}>Desglose casetas \u00b7 tarifa moto</div>
            {ruta.casetas.map((c,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:`1px solid ${T.border}`}}>
                <span style={{fontSize:12,color:T.muted}}>\uD83D\udEE3 {c.n}</span><span style={{...rj(14,600,T.text)}}>${c.f}</span>
              </div>
            ))}
            <div style={{marginTop:12,padding:'9px 12px',background:T.aD,borderRadius:9,fontSize:11,color:T.a}}>\uD83C\uDFDB Usa SCT Oficial para casetas exactas de cualquier ruta</div>
            <button onClick={()=>{setNavKm(ruta.km);setNavStep(0);setNavPct(0);setScr('navega');}} style={{...btnP(),marginTop:14}}>\uD83E\UDDED Iniciar Navegaci\u00f3n</button>
          </div>
        </div>}
      </div>
    );
  }

  function Navega(){
    const step=NAV_STEPS[navStep]||NAV_STEPS[0];
    const advance=()=>{const ns=Math.min(NAV_STEPS.length-1,navStep+1);const pct=ns/(NAV_STEPS.length-1);setNavStep(ns);setNavPct(pct);setNavKm(+(ruta.km*(1-pct)).toFixed(1));};
    const reset=()=>{setNavStep(0);setNavKm(ruta.km);setNavPct(0);};
    const pos=routePoint(ruta.coords,navPct);
    const navRiders=[{lat:pos[0],lng:pos[1],color:T.a,you:true,name:'T\u00fa'},{lat:pos[0]+0.012,lng:pos[1]+0.010,color:T.b,you:false,name:'Carlos',spd:92,bat:65}];
    return <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg,overflow:'hidden'}}>
      <div style={{background:T.surf,borderBottom:`1px solid ${T.border}`,padding:'14px 18px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:56,height:56,background:T.a,borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,flexShrink:0}}>{step.icon}</div>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:T.text,lineHeight:1.3}}>{step.txt}</div><div style={{...rj(24,700,T.a),marginTop:4}}>{step.dist}</div></div>
          <div style={{...rj(10,600,T.muted),letterSpacing:1}}>{navStep+1}/{NAV_STEPS.length}</div>
        </div>
      </div>
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        <MapaReal height="100%" center={[pos[0]+0.02,pos[1]]} zoom={13} riders={navRiders} route={ruta.coords} casetas={ruta.casetas} label="Navegaci\u00f3n activa" sub="OpenStreetMap \u00b7 CartoDB \u00b7 Gratis" accentColor={T.a} showGPS={true}/>
        <div style={{position:'absolute',top:12,left:12,background:'#00000099',backdropFilter:'blur(8px)',borderRadius:16,padding:'10px 16px',textAlign:'center',zIndex:1000}}>
          <div style={{...rj(38,700,T.text),lineHeight:1}}>94</div><div style={{fontSize:10,color:T.muted}}>km/h</div>
        </div>
        <div style={{position:'absolute',top:12,right:12,background:'#00000099',backdropFilter:'blur(8px)',borderRadius:12,padding:'8px 12px',zIndex:1000}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:2}}>Pr\u00f3x. caseta</div>
          <div style={{...rj(13,700,'#FF9A3C')}}>\u26E9 {ruta.casetas[0]?.n} \u00b7 ${ruta.casetas[0]?.f}</div>
        </div>
        <div style={{position:'absolute',bottom:12,left:12,background:'#00000099',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 12px',display:'flex',alignItems:'center',gap:6,zIndex:1000}}>
          <div style={dot()}/><span style={{...rj(11,600,T.a)}}>4 en grupo</span>
        </div>
      </div>
      <div style={{background:T.surf,borderTop:`1px solid ${T.border}`,padding:'12px 18px',flexShrink:0}}>
        <div style={{height:4,background:T.border,borderRadius:2,marginBottom:12,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${Math.round(navPct*100)}%`,background:T.a,borderRadius:2,transition:'width .4s'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-around',marginBottom:12}}>
          {[{v:navKm.toFixed(1),u:'km',l:'Restantes',c:T.a},{v:htime(navKm/ruta.spd),u:'',l:'Tiempo',c:T.text},{v:mxn(casTotal),u:'',l:'Casetas',c:'#FF9A3C'}].map((s,i)=>(
            <div key={i} style={{textAlign:'center'}}><div style={{...rj(20,700,s.c)}}>{s.v}<span style={{fontSize:10,color:T.muted}}>{s.u}</span></div><div style={{fontSize:9,color:T.muted,letterSpacing:1,textTransform:'uppercase',marginTop:2}}>{s.l}</div></div>
          ))}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={navPct>=1?reset:advance} style={{...btnP(navPct>=1?T.b:T.a),flex:1}}>{navPct>=1?'\u2713 Llegaste \u00b7 Nueva ruta':'\u25B6 Siguiente instrucci\u00f3n'}</button>
          <button onClick={reset} style={{padding:'13px 16px',background:T.card,border:`1px solid ${T.border}`,borderRadius:13,...rj(14,500,T.muted),cursor:'pointer'}}>\u21BA</button>
        </div>
      </div>
    </div>;
  }

  function Grupo(){
    const pos=GRUPO_POS[ruta.id]||GRUPO_POS.default;
    const riders=GRUPO_INFO.map((g,i)=>({...g,lat:pos[i][0],lng:pos[i][1]}));
    const center=routePoint(ruta.coords,.45);
    return <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={card({padding:0,overflow:'hidden'})}>
        <div style={{padding:'12px 16px 10px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div style={{...rj(13,700),marginBottom:2}}>{ruta.label}</div><div style={{fontSize:11,color:T.muted}}>5 motociclistas \u00b7 GPS real</div></div>
          <div style={{display:'flex',alignItems:'center',gap:5}}><div style={dot()}/><span style={{...rj(10,600,T.a),letterSpacing:1}}>EN VIVO</span></div>
        </div>
        <div style={{padding:'0 12px 12px'}}>
          <MapaReal height={190} center={center} zoom={10} riders={riders} route={ruta.coords} casetas={ruta.casetas} label="Grupo en tiempo real" sub="Firebase GPS \u00b7 actualiza cada 5s en producci\u00f3n" accentColor={T.a} showGPS={true}/>
        </div>
      </div>
      <div style={card()}>
        <div style={sec()}>Miembros del grupo</div>
        {GRUPO_INFO.map((r,i)=>(
          <div key={r.name} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:`1px solid ${T.border}`}}>
            <div style={{width:40,height:40,borderRadius:13,background:r.color+'20',border:`2px solid ${r.color}33`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>\uD83C\uDFCD</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                <span style={{fontSize:13,fontWeight:600,color:r.you?T.a:T.text}}>{r.name}</span>
                {r.pct===Math.max(...GRUPO_INFO.map(x=>x.pct))&&<span style={tg(T.a)}>L\u00edder</span>}
                {r.you&&<span style={tg(T.b)}>T\u00fa</span>}
              </div>
              <div style={{height:4,background:T.border,borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',width:`${r.pct}%`,background:r.color,borderRadius:2}}/></div>
              <div style={{fontSize:10,color:T.muted,marginTop:3}}>{r.pct}% completado</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{...rj(17,700,r.color)}}>{r.spd}<span style={{fontSize:10,color:T.muted}}> km/h</span></div>
              <div style={{fontSize:10,color:T.muted,marginTop:2}}>\uD83D\uDD0B {r.bat}%</div>
            </div>
          </div>
        ))}
      </div>
    </div>;
  }

  function Negocios(){
    return <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={card({background:T.aD,borderColor:T.a+'33',padding:'10px 14px'})}><div style={{fontSize:13,color:T.a,fontWeight:500}}>\uD83D\uDCCD Negocios en ruta: {ruta.from} \u2192 {ruta.to}</div></div>
      {NEGOCIOS.map(n=>(
        <div key={n.id} style={card({borderLeft:n.sp?`3px solid ${T.a}`:'none'})}>
          <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
            <div style={{width:48,height:48,background:T.surf,borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0,border:`1px solid ${T.border}`}}>{n.ico}</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}><span style={{fontSize:11,color:T.muted}}>{n.cat}</span>{n.sp&&<span style={tg(T.a)}>Patrocinado</span>}</div>
              <div style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:4}}>{n.name}</div>
              <div style={{display:'flex',gap:8,marginBottom:8}}><span style={{fontSize:12,color:T.yellow}}>\u2605 {n.stars}</span><span style={{fontSize:11,color:T.muted}}>({n.rev}) \u00b7 {n.km} km</span></div>
              <div style={{background:T.bD,border:`1px solid ${T.b}33`,borderRadius:8,padding:'6px 10px',fontSize:12,color:T.b}}>\uD83C\uDF81 {n.promo}</div>
            </div>
          </div>
        </div>
      ))}
    </div>;
  }

  function Mas(){
    return <div style={{flex:1,overflowY:'auto',padding:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={sec({marginBottom:0})}>Mantenimiento predictivo</div>
        {specs&&<span style={tg(T.a)}>\u2713 {moto.modelo}</span>}
      </div>
      {mantItems.map((m,i)=>{
        const pct=Math.min(100,Math.round(m.ult/m.prox*100));
        const col=m.urg?T.red:pct>80?T.yellow:T.a;
        return <div key={i} style={card({borderLeft:`3px solid ${col}`,padding:'12px 14px'})}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><span style={{fontSize:13,fontWeight:600,color:T.text}}>{m.item}</span>{m.urg&&<span style={tg(T.red)}>Urgente</span>}</div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:T.muted,marginBottom:7}}><span>Cada {m.cada}</span><span style={{color:col,fontWeight:600}}>faltan {m.prox-m.ult} km</span></div>
          <div style={{height:5,background:T.border,borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,background:col,borderRadius:3}}/></div>
        </div>;
      })}
      {!specs&&<div style={card({borderColor:T.a+'33',background:T.aD,cursor:'pointer',padding:'12px 14px'})} onClick={()=>setScr('moto')}><div style={{fontSize:12,color:T.a,textAlign:'center'}}>\uD83E\uDD16 Registra tu moto para mantenimiento personalizado</div></div>}
      <div style={sec({marginTop:6})}>Mis estad\u00edsticas</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        {[{v:'4,827',u:'km',l:'\uD83D\udEE3 Total km',c:T.a},{v:'23',u:'',l:'\uD83C\uDFCD Rodadas',c:T.b},{v:'$4,210',u:'',l:'\uD83D\uDCB8 Casetas mes',c:'#FF9A3C'},{v:'186',u:'L',l:'\u26FD Gasolina mes',c:T.c}].map((s,i)=>(
          <div key={i} style={sb(s.c)}><div style={{...rj(22,700,s.c)}}>{s.v}<span style={{fontSize:11,color:T.muted}}>{s.u}</span></div><div style={{fontSize:10,color:T.muted,marginTop:4}}>{s.l}</div></div>
        ))}
      </div>
      <div style={card({borderLeft:`3px solid ${T.red}`,textAlign:'center',padding:'22px 16px'})}>
        <div style={{fontSize:13,color:T.muted,marginBottom:14}}>\u00bfEmergencia en carretera?</div>
        <button style={{...btnP(T.red,'#fff'),fontSize:18,letterSpacing:3,padding:'16px'}}>\uD83C\uDD98 BOT\u00d3N SOS</button>
        <div style={{fontSize:11,color:T.muted,marginTop:12,lineHeight:1.7}}>Comparte ubicaci\u00f3n \u00b7 Emergencias \u00b7 Taller m\u00e1s cercano</div>
      </div>
    </div>;
  }

  const NAV=[{id:'home',ico:'\uD83C\uDFE0',lbl:'Inicio'},{id:'moto',ico:'\uD83C\uDFCD',lbl:'Mi Moto'},{id:'ruta',ico:'\uD83D\uddFA',lbl:'Ruta'},{id:'navega',ico:'\uD83E\UDDED',lbl:'GPS'},{id:'grupo',ico:'\uD83D\uDCE1',lbl:'Grupo'},{id:'negocios',ico:'\uD83C\uDFE2',lbl:'Negoc.'},{id:'mas',ico:'\u2699\uFE0F',lbl:'M\u00e1s'}];
  const TITLES={home:'Tu copiloto moto',moto:'Mi Moto \u00b7 IA',ruta:'Planear Ruta',navega:'Navegaci\u00f3n GPS',grupo:'Grupo en Vivo',negocios:'Negocios en Ruta',mas:'M\u00e1s'};

  return(
    <div style={{fontFamily:"'Barlow',sans-serif",background:T.bg,color:T.text,height:'100vh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden',transition:'background .3s'}}>
      {scr!=='navega'&&<div style={{background:T.surf,borderBottom:`1px solid ${T.border}`,padding:'11px 18px 9px',display:'flex',alignItems:'center',flexShrink:0}}>
        <div style={{...rj(22,700,T.a),letterSpacing:4}}>RODADA</div>
        <div style={{fontSize:10,color:T.muted,marginLeft:8,marginTop:4,...rj(10,500,T.muted),letterSpacing:2,textTransform:'uppercase'}}>{TITLES[scr]}</div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6}}><div style={dot()}/><span style={{...rj(10,600,T.a)}}>GPS</span></div>
      </div>}
      <ThemePicker/>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {scr==='home'&&Home()}
        {scr==='moto'&&MiMoto()}
        {scr==='ruta'&&Ruta()}
        {scr==='navega'&&Navega()}
        {scr==='grupo'&&Grupo()}
        {scr==='negocios'&&Negocios()}
        {scr==='mas'&&Mas()}
      </div>
      <div style={{display:'flex',background:T.surf,borderTop:`1px solid ${T.border}`,flexShrink:0}}>
        {NAV.map(n=>{const a=scr===n.id;return(
          <button key={n.id} onClick={()=>setScr(n.id)} style={{flex:1,padding:'7px 0 9px',background:'none',border:'none',borderTop:`2px solid ${a?T.a:'transparent'}`,color:a?T.a:T.muted,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'color .15s'}}>
            <span style={{fontSize:16}}>{n.ico}</span>
            <span style={{...rj(8,a?700:500,a?T.a:T.muted),letterSpacing:1,textTransform:'uppercase'}}>{n.lbl}</span>
          </button>
        );})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Rodada));

</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js')
      .then(function(r){console.log('RODADA v5 OK');})
      .catch(function(e){console.log('SW err',e);});
  });
}
</script>
</body>
</html>
