async function fetchMotoSpecs(marca,modelo,year){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'Specs de '+marca+' '+modelo+' '+year+'. SOLO JSON: {"rendimiento_kmL":n,"tanque_litros":n,"aceite_tipo":"s","aceite_cada_km":n,"cadena_cada_km":n,"filtro_aire_cada_km":n,"bujias_cada_km":n,"pastillas_cada_km":n,"neumaticos_cada_km":n,"presion_delantera_bar":n,"presion_trasera_bar":n,"potencia_hp":n,"torque_nm":n,"tipo":"s","consejo_mx":"s"}'}]})});
  const data=await res.json();
  return JSON.parse(data.content.find(b=>b.type==='text')?.text?.trim()||'{}');
}

  function Navega(){
    const step=NAV_STEPS[navStep]||NAV_STEPS[0];

    const reset=()=>{setNavStep(0);setNavKm(ruta.km);setNavPct(0);};
    const coords=ruta.coords||RUTAS_AUTOPISTA[0].coords;
    const pos=routePoint(coords,navPct);
    const navRiders=[{lat:pos[0],lng:pos[1],color:T.a,you:true,name:'Tú'},{lat:pos[0]+0.005,lng:pos[1]+0.008,color:T.b,you:false,name:'Chavo',spd:75}];
    return(<div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg,overflow:'hidden'}}>

          <div style={{width:58,height:58,background:T.aD,border:'1.5px solid '+T.aB,borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>{step.icon}</div>
          <div style={{flex:1}}><div style={{fontSize:15,fontWeight:600,color:T.text,lineHeight:1.3}}>{step.txt}</div><div style={{fontSize:24,fontWeight:900,color:T.a,marginTop:4}}>{step.dist}</div></div>

        </div>
      </div>
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        <MapaReal height="100%" center={[pos[0]+0.01,pos[1]]} zoom={13} riders={navRiders} route={coords} casetas={ruta.casetas||[]} spots={SPOTS_MOTO.slice(0,5)} label="Navegación · Córdoba VER" accentColor={T.a} showGPS={true}/>
        <div style={{position:'absolute',top:12,left:12,background:'rgba(255,255,255,.95)',backdropFilter:'blur(8px)',borderRadius:14,padding:'10px 16px',textAlign:'center',zIndex:1000,boxShadow:'0 2px 12px rgba(0,0,0,.15)'}}>
          <div style={{fontSize:36,fontWeight:900,color:T.text,lineHeight:1}}>78</div><div style={{fontSize:11,color:T.muted}}>km/h</div>
        </div>
        <div style={{position:'absolute',top:12,right:12,background:'rgba(255,255,255,.95)',backdropFilter:'blur(8px)',borderRadius:12,padding:'8px 13px',zIndex:1000,boxShadow:'0 2px 12px rgba(0,0,0,.15)'}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:2}}>Próx. caseta</div>
          <div style={{fontSize:13,fontWeight:700,color:'#F59E0B'}}>⛩ {(ruta.casetas||[{n:'Sin caseta',f:0}])[0]?.n}</div>

      <div style={{background:T.surf,borderTop:'1px solid '+T.border,padding:'13px 18px',flexShrink:0}}>
        <div style={{height:4,background:T.border,borderRadius:2,marginBottom:13,overflow:'hidden'}}><div style={{height:'100%',width:Math.round(navPct*100)+'%',background:T.a,borderRadius:2,transition:'width .4s'}}/></div>
        <div style={{display:'flex',justifyContent:'space-around',marginBottom:13}}>
          {[{v:navKm.toFixed(1),u:'km',l:'Restantes',c:T.a},{v:htime(navKm/(ruta.spd||80)),u:'',l:'Tiempo',c:T.text},{v:mxn(casTotal),u:'',l:'Casetas',c:'#F59E0B'}].map((s,i)=>(<div key={i} style={{textAlign:'center'}}><div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}<span style={{fontSize:11,color:T.muted}}>{s.u}</span></div><div style={{fontSize:11,color:T.muted,letterSpacing:.5,textTransform:'uppercase',marginTop:2}}>{s.l}</div></div>))}

      <div style={sec({marginTop:8})}>Mis estadísticas</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        {[{v:'4,827',u:'km',l:'🛣 Total',c:T.a},{v:String(23+diario.length),u:'',l:'🏍 Rodadas',c:T.b},{v:'$4,210',u:'',l:'💸 Casetas mes',c:'#F59E0B'},{v:'186',u:'L',l:'⛽ Gasolina mes',c:'#8B5CF6'}].map((s,i)=>(<div key={i} style={sb(s.c,'#F9FAFB')}><div style={{fontSize:24,fontWeight:900,color:s.c,lineHeight:1}}>{s.v}<span style={{fontSize:13,color:T.muted}}>{s.u}</span></div><div style={{fontSize:13,color:T.textSec,marginTop:4,border:'none'}}>{s.l}</div></div>))}
      </div>
      <div style={{background:T.redD,border:'1px solid '+T.redB,borderRadius:16,textAlign:'center',padding:'24px 16px',marginBottom:14}}>
        <div style={{fontSize:14,color:T.muted,marginBottom:15}}>¿Emergencia en carretera?</div>
        <button style={{...btnSolid(T.red),fontSize:18,letterSpacing:1,padding:'18px'}}>🆘 BOTÓN SOS</button>
        <div style={{fontSize:13,color:T.muted,marginTop:13,lineHeight:1.7}}>Comparte ubicación · Emergencias · Taller más cercano</div>
      </div>
    </div>
  );}

  const NAV=[{id:'home',ico:'🏠',lbl:'Inicio'},{id:'moto',ico:'🏍',lbl:'Mi Moto'},{id:'ruta',ico:'🗺',lbl:'Ruta'},{id:'navega',ico:'🧭',lbl:'GPS'},{id:'grupo',ico:'📡',lbl:'Grupo'},{id:'negocios',ico:'🏢',lbl:'Negoc.'},{id:'mas',ico:'⚙️',lbl:'Más'}];
  const TITLES={home:'Córdoba, Veracruz',moto:'Mi Moto · IA',ruta:'Planear Ruta',navega:'Navegación GPS',grupo:'Grupo + Rodadas',negocios:'Negocios',mas:'Más'};

  if(scr==='reg')return(<div style={{fontFamily:"'Inter',sans-serif",background:T.bg,color:T.text,height:'100dvh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden'}}>{Registro()}</div>);

  return(
    <div style={{fontFamily:"'Inter',sans-serif",background:T.bg,color:T.text,height:'100dvh',display:'flex',flexDirection:'column',maxWidth:440,margin:'0 auto',overflow:'hidden'}}>
      {scr!=='navega'&&<div style={{background:T.surf,borderBottom:'1px solid '+T.border,padding:'12px 18px',display:'flex',alignItems:'center',flexShrink:0}}>
        <div style={{fontSize:22,fontWeight:900,color:T.text,letterSpacing:2}}>ROD<span style={{color:T.a}}>ADA</span></div>
        <div style={{fontSize:11,color:T.muted,marginLeft:10,fontWeight:600,letterSpacing:1.5,textTransform:'uppercase'}}>{TITLES[scr]}</div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6,background:T.aD,border:'1px solid '+T.aB,borderRadius:20,padding:'4px 10px'}}><div style={dot()}/><span style={{fontSize:10,fontWeight:700,color:T.a,letterSpacing:1}}>GPS</span></div>
      </div>}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {scr==='home'&&Home()}{scr==='moto'&&MiMoto()}{scr==='ruta'&&Ruta()}{scr==='navega'&&Navega()}{scr==='grupo'&&Grupo()}{scr==='negocios'&&Negocios()}{scr==='mas'&&Mas()}
      </div>
      <div style={{display:'flex',background:T.surf,borderTop:'1px solid '+T.border,flexShrink:0,paddingBottom:'env(safe-area-inset-bottom)'}}>
        {NAV.map(n=>{const a=scr===n.id;return(
          <button key={n.id} onClick={()=>setScr(n.id)} style={{flex:1,padding:'8px 0 10px',background:'none',border:'none',borderTop:'2.5px solid '+(a?T.a:'transparent'),color:a?T.a:T.muted,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'color .15s'}}>
            <span style={{fontSize:18}}>{n.ico}</span>
            <span style={{fontSize:10,fontWeight:a?700:500,letterSpacing:.5,textTransform:'uppercase'}}>{n.lbl}</span>
          </button>);})}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Rodada));

</script>

</script>
